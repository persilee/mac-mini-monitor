<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac mini · 监控</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(1100px 700px at 50% 0%, #12201a 0%, #0a0f0d 55%, #070a09 100%);
    color: #eafff0;
    font-family: "SF Mono", "Menlo", "PingFang SC", monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .screen {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 20px 24px 14px;
    gap: 14px;
  }

  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 14px;
    min-height: 0;
  }

  .card {
    background: linear-gradient(180deg, #141d18 0%, #0f1512 100%);
    border: 1px solid #26392d;
    border-radius: 18px;
    padding: 18px 26px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    min-width: 0; min-height: 0;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .label {
    display: flex; align-items: center; gap: 10px;
    font-size: 26px; font-weight: 700;
    letter-spacing: 4px;
    color: #8fd8a4;
  }
  .label .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #58e08a;
    box-shadow: 0 0 12px rgba(88,224,138,0.8);
  }
  .card.temp .label .dot { background: #4fd8eb; box-shadow: 0 0 12px rgba(79,216,235,0.8); }
  .card.stat .label .dot { background: #b78cff; box-shadow: 0 0 12px rgba(183,140,255,0.8); }

  .value-line {
    display: flex; align-items: baseline; gap: 10px;
    flex: 1 1 auto;
    justify-content: center;
    min-height: 0;
  }
  .big {
    font-size: 132px;
    font-weight: 700;
    line-height: 1;
    color: #ffffff;
    letter-spacing: 2px;
    text-shadow: 0 0 22px rgba(88,224,138,0.35);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .unit {
    font-size: 40px;
    color: #7fa08a;
    font-weight: 600;
  }
  .bigtxt {
    font-size: 132px; font-weight: 700; line-height: 1;
    color: #58e08a;
    text-shadow: 0 0 22px rgba(88,224,138,0.4);
  }
  .bigtxt.warn { color: #ffd76e; text-shadow: 0 0 22px rgba(255,215,110,0.4); }
  .bigtxt.crit { color: #ff6b6b; text-shadow: 0 0 22px rgba(255,107,107,0.4); }

  .sub {
    font-size: 26px;
    color: #6f8f7c;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    white-space: nowrap;
    overflow: hidden;
  }
  .sub .em { color: #c8e8d2; }

  .bar {
    width: 100%; height: 10px;
    background: #1d2b22; border-radius: 5px; overflow: hidden;
  }
  .bar i {
    display: block; height: 100%;
    background: linear-gradient(90deg, #2f9e5c, #58e08a);
    border-radius: 5px;
    transition: width 0.6s ease;
  }
  .bar i.warn { background: linear-gradient(90deg, #d8a62e, #ffd76e); }
  .bar i.crit { background: linear-gradient(90deg, #d23b3b, #ff6b6b); }

  .footer {
    flex: 0 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 20px; color: #6f8f7c;
    letter-spacing: 1px;
    border-top: 1px solid #1d3326;
    padding-top: 10px;
  }
  .footer .dot {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    background: #58e08a; margin-right: 9px;
    animation: pulse 2s ease-in-out infinite;
  }
  .footer .dot.warn { background: #ffd76e; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .footer .hint { color: #4d6b5a; font-size: 18px; }

  .flip {
    display: inline-block;
    animation: flipIn 0.36s ease-out;
    transform-origin: 50% 50%;
  }
  @keyframes flipIn {
    0%   { transform: rotateX(88deg); opacity: 0.2; }
    60%  { transform: rotateX(-14deg); opacity: 1; }
    100% { transform: rotateX(0); }
  }
</style>
</head>
<body>
<div class="screen">
  <div class="grid">

    <!-- CPU -->
    <div class="card">
      <div class="label"><span class="dot"></span>CPU</div>
      <div class="value-line">
        <span class="big" id="cpu">--</span><span class="unit">%</span>
      </div>
      <div class="bar"><i id="cpu-bar" style="width:0%"></i></div>
      <div class="sub"><span>用户 <span class="em" id="cpu-user">--</span></span><span>系统 <span class="em" id="cpu-sys">--</span></span></div>
    </div>

    <!-- 内存 -->
    <div class="card">
      <div class="label"><span class="dot"></span>内存</div>
      <div class="value-line">
        <span class="big" id="mem">--</span><span class="unit">%</span>
      </div>
      <div class="bar"><i id="mem-bar" style="width:0%"></i></div>
      <div class="sub"><span>已用 <span class="em" id="mem-used">--</span></span><span>可用 <span class="em" id="mem-free">--</span></span></div>
    </div>

    <!-- CPU 温度 -->
    <div class="card temp">
      <div class="label"><span class="dot"></span>CPU 温度</div>
      <div class="value-line">
        <span class="big" id="temp">--</span><span class="unit">°C</span>
      </div>
      <div class="bar"><i id="temp-bar" style="width:0%"></i></div>
      <div class="sub"><span>来源</span><span class="em" id="temp-src">Macs Fan Control</span></div>
    </div>

    <!-- 状态 -->
    <div class="card stat">
      <div class="label"><span class="dot"></span>状态</div>
      <div class="value-line">
        <span class="bigtxt" id="stat">--</span>
      </div>
      <div class="bar"><i id="stat-bar" style="width:0%"></i></div>
      <div class="sub"><span>负载 <span class="em" id="stat-load">--</span></span><span>运行 <span class="em" id="stat-uptime">--</span></span></div>
    </div>

  </div>

  <div class="footer">
    <div><span class="dot" id="therm-dot"></span><span id="therm">散热正常</span></div>
    <div class="hint">温度读取 · 请保持 MFC 主窗口开启</div>
    <div id="up-foot"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var API = "/api";
  var COL_OK = "#58e08a", COL_WARN = "#ffd76e", COL_CRIT = "#ff6b6b";

  function el(id) { return document.getElementById(id); }

  function flip(id, text) {
    var node = el(id);
    if (!node) return;
    if (node.textContent === text) return;
    node.classList.remove("flip");
    void node.offsetWidth;
    node.classList.add("flip");
    node.textContent = text;
  }

  function setBar(id, pct, mode) {
    var b = el(id);
    if (!b) return;
    var p = Math.max(0, Math.min(100, pct));
    b.style.width = p + "%";
    b.className = mode || "";
  }

  function fmtGB(n) { return (n / 1073741824).toFixed(1) + "G"; }

  function colorFor(pct, hi, crit) {
    return pct >= crit ? COL_CRIT : (pct >= hi ? COL_WARN : COL_OK);
  }

  function update(d) {
    if (!d || !d.ok) return;

    // CPU
    if (d.cpu) {
      flip("cpu", d.cpu.pct.toFixed(0));
      var c = colorFor(d.cpu.pct, 75, 90);
      el("cpu").style.color = c;
      setBar("cpu-bar", d.cpu.pct, d.cpu.pct >= 90 ? "crit" : (d.cpu.pct >= 75 ? "warn" : ""));
      flip("cpu-user", d.cpu.user.toFixed(1) + "%");
      flip("cpu-sys", d.cpu.sys.toFixed(1) + "%");
    }

    // 内存
    if (d.mem) {
      flip("mem", d.mem.pct.toFixed(0));
      var mc = colorFor(d.mem.pct, 75, 90);
      el("mem").style.color = mc;
      setBar("mem-bar", d.mem.pct, d.mem.pct >= 90 ? "crit" : (d.mem.pct >= 75 ? "warn" : ""));
      flip("mem-used", fmtGB(d.mem.used));
      flip("mem-free", fmtGB(d.mem.total - d.mem.used));
    }

    // CPU 温度
    if (d.temp !== undefined) {
      if (d.temp === null) {
        flip("temp", "--");
        setBar("temp-bar", 0);
        el("temp").style.color = "#7fa08a";
        flip("temp-src", "请打开 MFC 主窗口");
      } else {
        flip("temp", d.temp.toFixed(0));
        var tc = colorFor(d.temp, 80, 92);
        el("temp").style.color = tc;
        setBar("temp-bar", d.temp / 100 * 100, d.temp >= 92 ? "crit" : (d.temp >= 80 ? "warn" : ""));
        flip("temp-src", "Macs Fan Control");
      }
    }

    // 状态 / 散热
    var isNormal = d.therm ? d.therm.indexOf("正常") !== -1 : true;
    flip("stat", isNormal ? "正常" : "偏高");
    var st = el("stat");
    st.className = "bigtxt" + (isNormal ? "" : (d.therm && d.therm.indexOf("限频") !== -1 ? " crit" : " warn"));
    setBar("stat-bar", isNormal ? 0 : 100, isNormal ? "" : "warn");
    if (d.cpu) flip("stat-load", d.cpu.pct.toFixed(0) + "%");
    if (d.uptime) {
      flip("stat-uptime", d.uptime);
      el("up-foot").textContent = d.uptime;
    }
    el("therm").textContent = "散热: " + (d.therm || "正常");
    el("therm-dot").className = "dot" + (isNormal ? "" : " warn");
  }

  function poll() {
    fetch(API, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(update)
      .catch(function () {});
  }

  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
