<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac mini · 监控</title>
<style>
  /* Dracula 主题 */
  :root {
    --bg0: #16161e; --bg1: #1e1f29; --bg2: #282a36; --line: #44475a;
    --txt: #f8f8f2; --dim: #6272a4;
    --pink: #ff79c6; --purple: #bd93f9; --cyan: #8be9fd;
    --green: #50fa7b; --orange: #ffb86c; --red: #ff5555; --yellow: #f1fa8c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(1100px 700px at 50% 0%, #2d2f3d 0%, #1e1f29 55%, #16161e 100%);
    color: var(--txt);
    font-family: "SF Mono", "Menlo", "PingFang SC", monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .screen {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 20px 24px 14px;
    gap: 14px;
  }

  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 14px;
    min-height: 0;
  }

  .card {
    background: linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 22px;
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .card-top {
    display: flex; align-items: center; gap: 10px;
    font-size: 26px; font-weight: 700;
    letter-spacing: 4px;
    flex: 0 0 auto;
  }
  .card-top .dot {
    width: 12px; height: 12px; border-radius: 50%;
    box-shadow: 0 0 12px currentColor;
  }
  .card-top .tag { font-size: 16px; color: var(--dim); letter-spacing: 1px; font-weight: 400; }

  .card-body {
    flex: 1 1 auto;
    display: flex; align-items: center; gap: 20px;
    min-height: 0;
  }

  /* 环形进度（渐变） */
  .ring {
    width: 210px; height: 210px;
    border-radius: 50%;
    background: conic-gradient(var(--purple) 0deg, var(--pink) 0deg, var(--line) 0deg 360deg);
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
    position: relative;
    filter: drop-shadow(0 0 14px rgba(189,147,249,0.35));
  }
  .ring::after {
    content: ""; position: absolute;
    inset: 16px;
    border-radius: 50%;
    background: var(--bg1);
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.55);
  }
  .ring-num {
    position: relative; z-index: 1;
    text-align: center;
    font-weight: 700;
  }
  .ring-num .v {
    font-size: 58px; line-height: 1;
    color: var(--txt);
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .ring-num .u {
    font-size: 21px; color: var(--dim);
    display: block; margin-top: 6px;
  }

  /* 参数行 */
  .rows {
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 16px;
    min-width: 0;
  }
  .row {
    display: grid;
    grid-template-columns: 64px 1fr 40px;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .row .rl { font-size: 20px; color: var(--dim); white-space: nowrap; }
  .row .rv {
    font-size: 30px; font-weight: 600;
    text-align: right; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .row .rv small { font-size: 16px; color: var(--dim); font-weight: 400; margin-left: 2px; }
  .mini {
    width: 40px; height: 7px;
    background: var(--line); border-radius: 4px; overflow: hidden;
    justify-self: end;
  }
  .mini i { display: block; height: 100%; border-radius: 4px; transition: width 0.5s ease; }

  /* 底部状态条 */
  .footer {
    flex: 0 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 20px; color: var(--dim);
    letter-spacing: 1px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }
  .footer .dot {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    background: var(--green); margin-right: 9px;
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 10px var(--green);
  }
  .footer .dot.warn { background: var(--orange); box-shadow: 0 0 10px var(--orange); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  .flip {
    display: inline-block;
    animation: flipIn 0.36s ease-out;
    transform-origin: 50% 50%;
  }
  @keyframes flipIn {
    0%   { transform: rotateX(88deg); opacity: 0.2; }
    60%  { transform: rotateX(-14deg); opacity: 1; }
    100% { transform: rotateX(0); }
  }
</style>
</head>
<body>
<div class="screen">
  <div class="grid">

    <!-- CPU -->
    <div class="card">
      <div class="card-top"><span class="dot" style="color:var(--purple);background:var(--purple)"></span>CPU<span class="tag">使用率</span></div>
      <div class="card-body">
        <div class="ring" id="cpu-ring">
          <div class="ring-num"><span class="v" id="cpu">--</span><span class="u">%</span></div>
        </div>
        <div class="rows">
          <div class="row"><span class="rl">用户态</span><span class="rv" id="cpu-user">--</span><span class="mini"><i id="cpu-user-bar"></i></span></div>
          <div class="row"><span class="rl">系统态</span><span class="rv" id="cpu-sys">--</span><span class="mini"><i id="cpu-sys-bar"></i></span></div>
        </div>
      </div>
    </div>

    <!-- 内存 -->
    <div class="card">
      <div class="card-top"><span class="dot" style="color:var(--cyan);background:var(--cyan)"></span>内存<span class="tag">已用</span></div>
      <div class="card-body">
        <div class="ring" id="mem-ring">
          <div class="ring-num"><span class="v" id="mem">--</span><span class="u">%</span></div>
        </div>
        <div class="rows">
          <div class="row"><span class="rl">已用</span><span class="rv" id="mem-used">--</span><span class="mini"><i id="mem-used-bar"></i></span></div>
          <div class="row"><span class="rl">可用</span><span class="rv" id="mem-free">--</span><span class="mini"><i id="mem-free-bar"></i></span></div>
        </div>
      </div>
    </div>

    <!-- CPU 温度 -->
    <div class="card">
      <div class="card-top"><span class="dot" style="color:var(--orange);background:var(--orange)"></span>CPU 温度<span class="tag">实时</span></div>
      <div class="card-body">
        <div class="ring" id="temp-ring">
          <div class="ring-num"><span class="v" id="temp">--</span><span class="u">°C</span></div>
        </div>
        <div class="rows">
          <div class="row"><span class="rl">散热</span><span class="rv" id="temp-therm">--</span><span class="mini"><i id="temp-therm-bar"></i></span></div>
          <div class="row"><span class="rl">来源</span><span class="rv" id="temp-src">MFC</span><span class="mini" style="visibility:hidden"></span></div>
        </div>
      </div>
    </div>

    <!-- 状态 -->
    <div class="card">
      <div class="card-top"><span class="dot" style="color:var(--pink);background:var(--pink)"></span>状态<span class="tag">整体</span></div>
      <div class="card-body">
        <div class="ring" id="stat-ring">
          <div class="ring-num"><span class="v" id="stat">--</span><span class="u">状态</span></div>
        </div>
        <div class="rows">
          <div class="row"><span class="rl">负载</span><span class="rv" id="stat-load">--</span><span class="mini"><i id="stat-load-bar"></i></span></div>
          <div class="row"><span class="rl">运行</span><span class="rv" id="stat-uptime">--</span><span class="mini" style="visibility:hidden"></span></div>
        </div>
      </div>
    </div>

  </div>

  <div class="footer">
    <div><span class="dot" id="therm-dot"></span><span id="therm">散热正常</span></div>
    <div id="up-foot"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var API = "/api";
  var LINE = "#44475a";
  /* Dracula 渐变对 */
  var G_CPU  = ["#bd93f9", "#ff79c6"];   // 紫 → 粉
  var G_MEM  = ["#8be9fd", "#50fa7b"];   // 青 → 绿
  var G_TEMP = ["#8be9fd", "#50fa7b"];   // 低温 青 → 绿
  var G_TEMP_WARM = ["#ffb86c", "#ff79c6"]; // 中温 橙 → 粉
  var G_TEMP_HOT  = ["#ff5555", "#ff6e6e"]; // 高温 红
  var G_STAT = ["#ff79c6", "#bd93f9"];   // 粉 → 紫

  function el(id) { return document.getElementById(id); }

  function flip(id, text) {
    var node = el(id);
    if (!node) return;
    if (node.textContent === text) return;
    node.classList.remove("flip");
    void node.offsetWidth;
    node.classList.add("flip");
    node.textContent = text;
  }

  /* 渐变环形: pct 0-100, [c1, c2] 渐变段, 其余轨道色 */
  function setRing(id, pct, grad) {
    var r = el(id);
    if (!r) return;
    var deg = Math.max(0, Math.min(100, pct)) * 3.6;
    r.style.background =
      "conic-gradient(" + grad[0] + " 0deg, " + grad[1] + " " + deg + "deg, " +
      LINE + " " + deg + "deg 360deg)";
  }

  function setBar(id, pct, color) {
    var b = el(id);
    if (!b) return;
    b.style.width = Math.max(0, Math.min(100, pct)) + "%";
    b.style.background = color || "linear-gradient(90deg, #bd93f9, #ff79c6)";
  }

  function fmtGB(n) { return (n / 1073741824).toFixed(1) + "G"; }

  function update(d) {
    if (!d || !d.ok) return;

    // CPU
    if (d.cpu) {
      flip("cpu", d.cpu.pct.toFixed(0));
      setRing("cpu-ring", d.cpu.pct, G_CPU);
      flip("cpu-user", d.cpu.user.toFixed(1) + "%");
      setBar("cpu-user-bar", d.cpu.user, "linear-gradient(90deg, #bd93f9, #ff79c6)");
      flip("cpu-sys", d.cpu.sys.toFixed(1) + "%");
      setBar("cpu-sys-bar", d.cpu.sys, "linear-gradient(90deg, #ff79c6, #bd93f9)");
    }

    // 内存
    if (d.mem) {
      flip("mem", d.mem.pct.toFixed(0));
      setRing("mem-ring", d.mem.pct, G_MEM);
      flip("mem-used", fmtGB(d.mem.used));
      setBar("mem-used-bar", d.mem.pct, "linear-gradient(90deg, #8be9fd, #50fa7b)");
      flip("mem-free", fmtGB(d.mem.total - d.mem.used));
      setBar("mem-free-bar", 100 - d.mem.pct, "linear-gradient(90deg, #50fa7b, #8be9fd)");
    }

    // CPU 温度
    if (d.temp !== undefined) {
      if (d.temp === null) {
        flip("temp", "--");
        setRing("temp-ring", 0, G_TEMP);
        flip("temp-src", "请打开 MFC");
      } else {
        flip("temp", d.temp.toFixed(0));
        var g = d.temp >= 85 ? G_TEMP_HOT : (d.temp >= 70 ? G_TEMP_WARM : G_TEMP);
        setRing("temp-ring", Math.min(100, d.temp), g);
        el("temp").style.color = d.temp >= 85 ? "#ff5555" : (d.temp >= 70 ? "#ffb86c" : "#f8f8f2");
        setBar("temp-therm-bar", Math.min(100, d.temp), "linear-gradient(90deg, " + g[0] + ", " + g[1] + ")");
        flip("temp-src", "MFC · 实时");
      }
    }

    // 状态 / 散热
    if (d.therm) {
      var isNormal = d.therm.indexOf("正常") !== -1;
      flip("stat", isNormal ? "正常" : "偏高");
      setRing("stat-ring", isNormal ? 100 : 66, G_STAT);
      el("stat").style.color = isNormal ? "#f8f8f2" : "#ffb86c";
      flip("temp-therm", d.therm);
      el("temp-therm").style.color = isNormal ? "#50fa7b" : "#ffb86c";
      setBar("temp-therm-bar", 100, "linear-gradient(90deg, #8be9fd, #50fa7b)");
      el("therm").textContent = "散热: " + d.therm;
      el("therm-dot").className = "dot" + (isNormal ? "" : " warn");
    }
    if (d.cpu) {
      flip("stat-load", d.cpu.pct.toFixed(0) + "%");
      setBar("stat-load-bar", d.cpu.pct, "linear-gradient(90deg, #ff79c6, #bd93f9)");
    }
    if (d.uptime) {
      flip("stat-uptime", d.uptime);
      el("up-foot").textContent = d.uptime;
    }
  }

  function poll() {
    fetch(API, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(update)
      .catch(function () {});
  }

  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
