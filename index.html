<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac mini · 监控</title>
<style>
  /* Dracula 主题 */
  :root {
    --bg0: #16161e; --bg1: #1e1f29; --bg2: #282a36; --line: #44475a;
    --txt: #f8f8f2; --dim: #b2bbc2;
    --pink: #ff79c6; --purple: #bd93f9; --cyan: #8be9fd;
    --green: #50fa7b; --orange: #ffb86c; --red: #ff5555; --yellow: #f1fa8c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(1100px 700px at 50% 0%, #2d2f3d 0%, #1e1f29 55%, #16161e 100%);
    color: var(--txt);
    font-family: "SF Mono", "Menlo", "PingFang SC", monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .screen {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 20px 24px 14px;
    gap: 14px;
  }

  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 14px;
    min-height: 0;
  }

  .card {
    background: linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 22px;
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .card-top {
    display: flex; align-items: center; gap: 10px;
    font-size: 26px; font-weight: 700;
    letter-spacing: 4px;
    flex: 0 0 auto;
  }
  .card-top .dot {
    width: 12px; height: 12px; border-radius: 50%;
    box-shadow: 0 0 12px currentColor;
  }
  .card-top .tag { font-size: 20px; color: var(--dim); letter-spacing: 1px; font-weight: 400; }

  .card-body {
    flex: 1 1 auto;
    display: flex; align-items: center; gap: 20px;
    min-height: 0;
  }

  /* 环形进度（SVG 圆头端点 + 渐变） */
  .ring {
    width: 210px; height: 210px;
    position: relative;
    flex: 0 0 auto;
  }
  .ring-svg {
    width: 100%; height: 100%;
    transform: rotate(-90deg);            /* 起点在 12 点方向 */
    filter: drop-shadow(0 0 12px rgba(189,147,249,0.3));
  }
  .ring-svg .rt {                          /* 轨道 */
    fill: none;
    stroke: var(--line);
    stroke-width: 11;
  }
  .ring-svg .rp {                          /* 进度(圆头)，stroke 用各自 HTML 属性引用 */
    fill: none;
    stroke-width: 11;
    stroke-linecap: round;                 /* 圆角端点 */
    stroke-dasharray: 0 276.46;            /* 周长 2π×44 */
    transition: stroke-dasharray 0.55s ease;
  }
  .ring-num {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 1;
    text-align: center;
    font-weight: 700;
  }
  .ring-num .v {
    font-size: 58px; line-height: 1;
    color: var(--txt);
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .ring-num .u {
    font-size: 21px; color: var(--dim);
    display: block; margin-top: 6px;
  }

  /* 参数行 */
  .rows {
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 16px;
    min-width: 0;
  }
  .row {
    display: grid;
    grid-template-columns: 64px 1fr 40px;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .row .rl { font-size: 20px; color: var(--dim); white-space: nowrap; }
  .row .rv {
    font-size: 30px; font-weight: 600;
    text-align: right; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .row .rv small { font-size: 16px; color: var(--dim); font-weight: 400; margin-left: 2px; }
  .mini {
    width: 40px; height: 7px;
    background: var(--line); border-radius: 4px; overflow: hidden;
    justify-self: end;
  }
  .mini i { display: block; height: 100%; border-radius: 4px; transition: width 0.5s ease; }

  /* 底部状态条 */
  .footer {
    flex: 0 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 20px; color: var(--dim);
    letter-spacing: 1px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }
  .footer .dot {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    background: var(--green); margin-right: 9px;
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 10px var(--green);
  }
  .footer .dot.warn { background: var(--orange); box-shadow: 0 0 10px var(--orange); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* 数字变化: 仅光晕(无放大) */
  .bump {
    animation: bump 0.45s ease-out;
  }
  @keyframes bump {
    0%   { text-shadow: 0 0 26px currentColor; }
    100% { text-shadow: 0 0 0 transparent; }
  }
</style>
</head>
<body>
<div class="screen">
  <div class="grid">

    <!-- CPU -->
    <div class="card">
      <div class="card-top"><span class="dot" style="color:var(--purple);background:var(--purple)"></span>CPU<span class="tag">使用率</span></div>
      <div class="card-body">
        <div class="ring">
          <svg viewBox="0 0 100 100" class="ring-svg">
            <defs>
              <linearGradient id="g-cpu" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#bd93f9"/><stop offset="100%" stop-color="#ff79c6"/>
              </linearGradient>
            </defs>
            <circle class="rt" cx="50" cy="50" r="44"/>
            <circle class="rp" id="cpu-prog" cx="50" cy="50" r="44" stroke="url(#g-cpu)"/>
          </svg>
          <div class="ring-num"><span class="v" id="cpu">--</span><span class="u">%</span></div>
        </div>
        <div class="rows">
          <div class="row"><span class="rl">用户态</span><span class="rv" id="cpu-user">--</span><span class="mini"><i id="cpu-user-bar"></i></span></div>
          <div class="row"><span class="rl">系统态</span><span class="rv" id="cpu-sys">--</span><span class="mini"><i id="cpu-sys-bar"></i></span></div>
        </div>
      </div>
    </div>

    <!-- 内存 -->
    <div class="card">
      <div class="card-top"><span class="dot" style="color:var(--cyan);background:var(--cyan)"></span>内存<span class="tag">已用</span></div>
      <div class="card-body">
        <div class="ring">
          <svg viewBox="0 0 100 100" class="ring-svg">
            <defs>
              <linearGradient id="g-mem" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8be9fd"/><stop offset="100%" stop-color="#50fa7b"/>
              </linearGradient>
            </defs>
            <circle class="rt" cx="50" cy="50" r="44"/>
            <circle class="rp" id="mem-prog" cx="50" cy="50" r="44" stroke="url(#g-mem)"/>
          </svg>
          <div class="ring-num"><span class="v" id="mem">--</span><span class="u">%</span></div>
        </div>
        <div class="rows">
          <div class="row"><span class="rl">已用</span><span class="rv" id="mem-used">--</span><span class="mini"><i id="mem-used-bar"></i></span></div>
          <div class="row"><span class="rl">可用</span><span class="rv" id="mem-free">--</span><span class="mini"><i id="mem-free-bar"></i></span></div>
        </div>
      </div>
    </div>

    <!-- CPU 温度 -->
    <div class="card">
      <div class="card-top"><span class="dot" style="color:var(--orange);background:var(--orange)"></span>CPU 温度<span class="tag">实时</span></div>
      <div class="card-body">
        <div class="ring">
          <svg viewBox="0 0 100 100" class="ring-svg">
            <defs>
              <linearGradient id="g-temp" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8be9fd"/><stop offset="100%" stop-color="#50fa7b"/>
              </linearGradient>
            </defs>
            <circle class="rt" cx="50" cy="50" r="44"/>
            <circle class="rp" id="temp-prog" cx="50" cy="50" r="44" stroke="url(#g-temp)"/>
          </svg>
          <div class="ring-num"><span class="v" id="temp">--</span><span class="u">°C</span></div>
        </div>
        <div class="rows">
          <div class="row"><span class="rl">散热</span><span class="rv" id="temp-therm">--</span><span class="mini"><i id="temp-therm-bar"></i></span></div>
          <div class="row"><span class="rl">来源</span><span class="rv" id="temp-src">MFC</span><span class="mini" style="visibility:hidden"></span></div>
        </div>
      </div>
    </div>

    <!-- 状态 -->
    <div class="card">
      <div class="card-top"><span class="dot" style="color:var(--pink);background:var(--pink)"></span>状态<span class="tag">整体</span></div>
      <div class="card-body">
        <div class="ring">
          <svg viewBox="0 0 100 100" class="ring-svg">
            <defs>
              <linearGradient id="g-stat" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff79c6"/><stop offset="100%" stop-color="#bd93f9"/>
              </linearGradient>
            </defs>
            <circle class="rt" cx="50" cy="50" r="44"/>
            <circle class="rp" id="stat-prog" cx="50" cy="50" r="44" stroke="url(#g-stat)"/>
          </svg>
          <div class="ring-num"><span class="v" id="stat">--</span><span class="u">状态</span></div>
        </div>
        <div class="rows">
          <div class="row"><span class="rl">负载</span><span class="rv" id="stat-load">--</span><span class="mini"><i id="stat-load-bar"></i></span></div>
          <div class="row"><span class="rl">运行</span><span class="rv" id="stat-uptime">--</span><span class="mini" style="visibility:hidden"></span></div>
        </div>
      </div>
    </div>

  </div>

  <div class="footer">
    <div><span class="dot" id="therm-dot"></span><span id="therm">散热正常</span></div>
    <div id="up-foot"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var API = "/api";
  var CIRC = 276.46;   // 2π×44
  /* Dracula 渐变对 */
  var G_CPU  = ["#bd93f9", "#ff79c6"];
  var G_MEM  = ["#8be9fd", "#50fa7b"];
  var G_TEMP = ["#8be9fd", "#50fa7b"];
  var G_TEMP_WARM = ["#ffb86c", "#ff79c6"];
  var G_TEMP_HOT  = ["#ff5555", "#ff6e6e"];
  var G_STAT = ["#ff79c6", "#bd93f9"];

  function el(id) { return document.getElementById(id); }

  /* 渐变环形: SVG 圆头端点 + 动态渐变颜色 */
  function setRing(progId, gradId, pct, colors) {
    var prog = el(progId);
    if (!prog) return;
    pct = Math.max(0, Math.min(100, pct));
    prog.style.strokeDasharray = (CIRC * pct / 100).toFixed(1) + " " + CIRC;
    try {
      var stops = el(gradId).querySelectorAll("stop");
      if (stops.length >= 2) {
        stops[0].setAttribute("stop-color", colors[0]);
        stops[0].style.setProperty("stop-color", colors[0]);
        stops[1].setAttribute("stop-color", colors[1]);
        stops[1].style.setProperty("stop-color", colors[1]);
      }
    } catch (e) { /* 渐变颜色更新失败不影响主流程 */ }
  }

  function setBar(id, pct, color) {
    var b = el(id);
    if (!b) return;
    b.style.width = Math.max(0, Math.min(100, pct)) + "%";
    b.style.background = color || "linear-gradient(90deg, #bd93f9, #ff79c6)";
  }

  var _vals = {};   // 数字动画当前值

  /* 平滑数字滚动: 旧值 -> 新值 300ms easeOutCubic */
  function animateNum(id, target, decimals, suffix) {
    var node = el(id);
    if (!node) return;
    var from = (_vals[id] !== undefined) ? _vals[id] : target;
    if (_vals[id] !== undefined && Math.abs(from - target) < 0.05) return;
    _vals[id] = target;
    bump(id);
    var t0 = null, dur = 300;
    function frame(ts) {
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);            // easeOutCubic
      var v = from + (target - from) * e;
      node.textContent = v.toFixed(decimals) + (suffix || "");
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* 变化光晕(无放大) */
  function bump(id) {
    var node = el(id);
    if (!node) return;
    node.classList.remove("bump");
    void node.offsetWidth;
    node.classList.add("bump");
  }

  /* 文本更新(带光晕) */
  function setText(id, text) {
    var node = el(id);
    if (!node) return;
    if (node.textContent === text) return;
    node.textContent = text;
    bump(id);
  }

  function update(d) {
    if (!d || !d.ok) return;

    // CPU
    if (d.cpu) {
      animateNum("cpu", d.cpu.pct, 0, "");
      setRing("cpu-prog", "g-cpu", d.cpu.pct, G_CPU);
      animateNum("cpu-user", d.cpu.user, 1, "%");
      setBar("cpu-user-bar", d.cpu.user, "linear-gradient(90deg, #bd93f9, #ff79c6)");
      animateNum("cpu-sys", d.cpu.sys, 1, "%");
      setBar("cpu-sys-bar", d.cpu.sys, "linear-gradient(90deg, #ff79c6, #bd93f9)");
    }

    // 内存
    if (d.mem) {
      animateNum("mem", d.mem.pct, 0, "");
      setRing("mem-prog", "g-mem", d.mem.pct, G_MEM);
      animateNum("mem-used", d.mem.used / 1073741824, 1, "G");
      setBar("mem-used-bar", d.mem.pct, "linear-gradient(90deg, #8be9fd, #50fa7b)");
      animateNum("mem-free", (d.mem.total - d.mem.used) / 1073741824, 1, "G");
      setBar("mem-free-bar", 100 - d.mem.pct, "linear-gradient(90deg, #50fa7b, #8be9fd)");
    }

    // CPU 温度
    if (d.temp !== undefined) {
      if (d.temp === null) {
        setText("temp", "--");
        setRing("temp-prog", "g-temp", 0, G_TEMP);
        setText("temp-src", "请打开 MFC");
      } else {
        animateNum("temp", d.temp, 0, "");
        var g = d.temp >= 85 ? G_TEMP_HOT : (d.temp >= 70 ? G_TEMP_WARM : G_TEMP);
        setRing("temp-prog", "g-temp", Math.min(100, d.temp), g);
        el("temp").style.color = d.temp >= 85 ? "#ff5555" : (d.temp >= 70 ? "#ffb86c" : "#f8f8f2");
        setBar("temp-therm-bar", Math.min(100, d.temp), "linear-gradient(90deg, " + g[0] + ", " + g[1] + ")");
        setText("temp-src", "MFC · 实时");
      }
    }

    // 状态 / 散热
    if (d.therm) {
      var isNormal = d.therm.indexOf("正常") !== -1;
      setText("stat", isNormal ? "正常" : "偏高");
      setRing("stat-prog", "g-stat", isNormal ? 100 : 66, G_STAT);
      el("stat").style.color = isNormal ? "#f8f8f2" : "#ffb86c";
      setText("temp-therm", d.therm);
      el("temp-therm").style.color = isNormal ? "#50fa7b" : "#ffb86c";
      setBar("temp-therm-bar", 100, "linear-gradient(90deg, #8be9fd, #50fa7b)");
      el("therm").textContent = "散热: " + d.therm;
      el("therm-dot").className = "dot" + (isNormal ? "" : " warn");
    }
    if (d.cpu) {
      animateNum("stat-load", d.cpu.pct, 0, "%");
      setBar("stat-load-bar", d.cpu.pct, "linear-gradient(90deg, #ff79c6, #bd93f9)");
    }
    if (d.uptime) {
      setText("stat-uptime", d.uptime);
      setText("up-foot", d.uptime);
    }
  }

  function poll() {
    fetch(API, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(update)
      .catch(function () {});
  }

  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
